name: Verify project

on:
  push:
    branches: [main, arena/01a0fd30-gemsdoe23]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run dependency-free tests
        run: python -m unittest discover -s tests -v
      - name: Check static-site local links
        run: python scripts/check_site.py
      - name: Re-audit the reference artefact (h19-5, live 0.1922)
        run: python scripts/audit_reference_tif.py docs/downloads/gems19-h19-5-powerlaw-budget-multiline-corroborated-20260930-e27054cf-nan.tif --json /tmp/reference-audit.json
      - name: Re-audit the current submission with the independent stdlib decoder
        run: |
          python - <<'EOF'
          import json, os, subprocess, sys
          man = json.load(open("docs/data/submission-manifest.json"))
          for key in ("primary", "compatibility"):
              name = man[key]["name"]
              out = "/tmp/%s-audit.json" % key
              subprocess.run([sys.executable, "scripts/audit_reference_tif.py",
                              os.path.join("docs/downloads", name), "--json", out], check=True)
              a = json.load(open(out))
              assert a["finite_values_in_0_1"] is True, (key, "values outside [0, 1]")
              assert a["positive_infinity_pixels"] == 0, key
              assert a["negative_infinity_pixels"] == 0, key
              assert a["samples_per_pixel"] == 1, (key, "must be single band")
              assert a["bits_per_sample"] == 32 and a["sample_format"] == "IEEE float", (key, "must be float32")
              assert a["epsg"] == 32611, (key, "CRS")
              assert a["width"] == 3292 and a["height"] == 3730, (key, "grid")
              assert a["classic_tiff"] is True and a["compression"] == "LZW", key
              assert a["sha256"] == man[key]["sha256"], (key, "sha256 drift")
              print("%s: %s verified (%d finite px, %d NaN, values %s-%s)" % (
                  key, name, a["finite_pixels"], a["nan_pixels"], a["finite_min"], a["finite_max"]))
          EOF
      - name: Probe the official leaderboard feed (diagnostic; never blocks)
        continue-on-error: true
        run: |
          # The public site serves a live leaderboard feed. This exercises the real fetch and
          # parser end to end and prints the diagnostics, so a bot-wall, a markup change or a
          # JS-only table shows up in the run log instead of silently leaving a stale board
          # published. continue-on-error keeps a third-party change from blocking unrelated work.
          # The step conclusion is not a usable signal - continue-on-error reports it as success
          # either way - so this exists to put the diagnostics in the run log for a human. The
          # machine-readable channel is docs/data/leaderboard-status.json, which pages.yml commits
          # to main on every run. This probe deliberately uses the plain-HTTP path only: installing
          # Chromium in every PR check is not worth it, and pages.yml exercises --render on main.
          # Known outcome as of 2026-10-02: the official board is client-rendered, so the plain GET
          # returns a shell (tables: 0) and this probe exits 1 without blocking anything.
          python scripts/update_leaderboard.py --strict --timeout 60 \
            --output /tmp/leaderboard-live.json --status /tmp/leaderboard-status.json
          echo "--- live refresh status ---"
          cat /tmp/leaderboard-status.json
          echo "--- first rows of what was parsed ---"
          python - <<'EOF'
          import json, pathlib
          path = pathlib.Path("/tmp/leaderboard-live.json")
          if not path.exists():
              print("no snapshot written")
          else:
              data = json.loads(path.read_text())
              print("source_status:", data.get("source_status"), "| strategy:", data.get("parse_strategy"))
              for row in data.get("rows", [])[:5]:
                  print("  #%s %-24s %s" % (row["rank"], row["participant"], row["score_text"]))
          EOF
      - name: Verify the site is regenerable from the evidence records
        run: |
          python scripts/build_site.py
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ is out of date with docs/data/*.json - run scripts/build_site.py and commit"
            git diff --stat -- docs
            exit 1
          fi
