name: Verify project

on:
  push:
    branches: [main, arena/01a0f9ff-gemsdoe23]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run dependency-free tests
        run: python -m unittest discover -s tests -v
      - name: Check static-site local links
        run: python scripts/check_site.py
      - name: Re-audit reference GeoTIFF
        run: python scripts/audit_reference_tif.py docs/downloads/gems19-h19-5-powerlaw-budget-multiline-corroborated-20260930-e27054cf-nan.tif --json /tmp/reference-audit.json
