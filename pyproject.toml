[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe23"
version = "0.1.0"
description = "Auditable GEMS geothermal fault-mapping research and submission tools"
requires-python = ">=3.10"

[project.optional-dependencies]
geo = ["numpy>=1.24", "scipy>=1.10", "rasterio>=1.3"]
model = ["torch>=2.1"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
